<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eyeGPT V11.0 | ULTIMATUM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --p: #00f2ff; --bg: #000205; --s: #001529; --g: #00ff95; --r: #ff0044; --glass: rgba(0, 20, 40, 0.7); }
        * { box-sizing: border-box; font-family: 'Orbitron', sans-serif; cursor: crosshair; }
        body { background: var(--bg); color: #fff; margin: 0; overflow: hidden; height: 100vh; }

        /* NEURAL PARTICLE BG */
        #bg-canvas { position: fixed; inset: 0; z-index: -1; }

        /* AUTH GATE V11 */
        #gate { position: fixed; inset: 0; background: radial-gradient(circle, #001529 0%, #000 100%); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hex-loader { width: 100px; height: 100px; border: 4px solid var(--p); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); animation: rotate 4s linear infinite; box-shadow: 0 0 30px var(--p); }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        /* MAIN DASHBOARD */
        #app { display: none; height: 100vh; grid-template-columns: 350px 1fr; gap: 10px; padding: 15px; }
        .panel-v11 { background: var(--glass); border: 1px solid rgba(0, 242, 255, 0.2); backdrop-filter: blur(15px); border-radius: 5px; display: flex; flex-direction: column; padding: 20px; position: relative; overflow: hidden; }
        .panel-v11::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--p), transparent); }

        /* UI ELEMENTS */
        .c-input { width: 100%; padding: 15px; background: rgba(0,0,0,0.5); border: 1px solid var(--s); color: var(--p); border-radius: 4px; margin-bottom: 15px; outline: none; font-size: 13px; }
        .btn-v11 { width: 100%; padding: 18px; background: transparent; border: 1px solid var(--p); color: var(--p); font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 3px; position: relative; transition: 0.3s; }
        .btn-v11:hover { background: var(--p); color: #000; box-shadow: 0 0 50px var(--p); }

        .terminal-stream { flex: 1; background: rgba(0,0,0,0.8); border: 1px solid #111; padding: 10px; font-family: 'Consolas', monospace; font-size: 10px; color: var(--g); overflow: hidden; line-height: 1.2; opacity: 0.6; }
        
        .matrix-text { color: var(--g); animation: fall 5s linear infinite; white-space: nowrap; }
        @keyframes fall { from { transform: translateY(-100%); } to { transform: translateY(100%); } }

        /* SHAKE EFFECT */
        .shake { animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="gate">
    <div class="hex-loader"></div>
    <h1 style="color:var(--p); letter-spacing: 10px; margin: 30px 0;">SINGULARITY_V11</h1>
    <input type="password" id="k" class="c-input" style="width:320px; text-align:center;" placeholder="AUTHENTICATE_PADUKA_REY">
    <button class="btn-v11" style="width:250px;" onclick="auth()">INITIATE_LINK</button>
</div>

<div id="app">
    <div class="panel-v11">
        <div style="text-align: center; margin-bottom: 20px;">
            <i class="fa fa-skull-beam" style="font-size: 40px; color: var(--p);"></i>
            <h2 style="margin: 10px 0; font-size: 18px;">PADUKA REY</h2>
            <div style="font-size: 10px; color: var(--g);"><i class="fa fa-circle"></i> SYSTEM_OVERLORD_ACTIVE</div>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="font-size: 10px; color: var(--p);">CORE_STRIKE_TYPE</label>
            <select id="payload" class="c-input">
                <option value="NULL_ENTITY">NULL_ENTITY (TOTAL ERASE)</option>
                <option value="VOID_STRIKE">VOID_STRIKE V11 (BYPASS FW)</option>
                <option value="NEURAL_OVERLOAD">NEURAL_OVERLOAD (RAM KILL)</option>
            </select>
            <label style="font-size: 10px; color: var(--p);">VECTOR_COORDINATES</label>
            <input type="text" id="target" class="c-input" placeholder="+62xxxxxxxxxxxx">
            <button class="btn-v11" onclick="execute()">RELEASE_ULTIMATUM</button>
        </div>

        <div class="terminal-stream" id="matrix-log">
            </div>
    </div>

    <div class="panel-v11">
        <div style="display:flex; justify-content: space-between; align-items:center; border-bottom: 1px solid var(--s); padding-bottom: 10px;">
            <span style="font-size: 12px; color: var(--p);">WAR_ROOM_COMMAND_CENTER</span>
            <span id="timer" style="color: var(--r);">00:00:00:00</span>
        </div>
        
        <div style="flex: 1; display: grid; grid-template-rows: 1fr 150px; gap: 10px; margin-top: 15px;">
            <div id="status-console" style="background: rgba(0,0,0,0.5); padding: 15px; border: 1px solid #111; color: var(--p); font-size: 12px; overflow-y: auto;">
                > Ready for deployment...
            </div>
            <div style="background: #000; border: 1px solid var(--s); position: relative; overflow: hidden;">
                <div id="radar-line" style="position: absolute; top:0; left:0; width: 100%; height: 2px; background: var(--p); opacity: 0.5; display: none;"></div>
                <div style="position: absolute; inset: 0; display: flex; align-items:center; justify-content: center; opacity: 0.2;">
                    <i class="fa fa-satellite-dish" style="font-size: 50px;"></i>
                </div>
                <div id="progress-val" style="position: absolute; bottom: 10px; right: 10px; font-size: 30px; font-weight: 900; color: var(--r);">0%</div>
            </div>
        </div>
    </div>
</div>

<script>
    const _K = "Paduka Rey";
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    
    // Background Particles
    let particles = [];
    function init() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        for(let i=0; i<100; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2, v: Math.random()*0.5 });
    }
    function draw() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = "#00f2ff";
        particles.forEach(p => {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
            p.y -= p.v; if(p.y < 0) p.y = canvas.height;
        });
        requestAnimationFrame(draw);
    }
    init(); draw();

    function auth() {
        if(document.getElementById('k').value.trim() === _K) {
            document.getElementById('gate').style.display = "none";
            document.getElementById('app').style.display = "grid";
            speak("Singularity linked. Welcome home, Paduka Rey.");
            startMatrix();
        } else { alert("DNA_REJECTED: UNKNOWN_IDENTITY"); }
    }

    function execute() {
        const t = document.getElementById('target').value;
        if(!t) return;
        
        speak("Ultimatum Protocol Engaged.");
        document.getElementById('radar-line').style.display = "block";
        document.getElementById('radar-line').style.animation = "moveScan 2s infinite";
        
        let p = 0;
        const iv = setInterval(() => {
            p += 2;
            document.getElementById('progress-val').innerText = p + "%";
            if(p > 80) document.getElementById('app').classList.add('shake');
            
            if(p % 10 === 0) log(`BREACHING_LAYER_${p/10}... OK`);
            
            if(p >= 100) {
                clearInterval(iv);
                document.getElementById('app').classList.remove('shake');
                document.getElementById('progress-val').style.color = "var(--g)";
                log(`[FATAL] TARGET ${t} HAS BEEN PULVERIZED.`);
                speak("Target neutralized.");
            }
        }, 100);
    }

    function log(m) {
        const c = document.getElementById('status-console');
        c.innerHTML += `<br><span style="color:var(--g)">[STRIKE]</span> > ${m}`;
        c.scrollTop = c.scrollHeight;
    }

    function startMatrix() {
        const m = document.getElementById('matrix-log');
        setInterval(() => {
            m.innerHTML += `<div class="matrix-text">${Math.random().toString(36).substring(2, 15)}</div>`;
            if(m.childNodes.length > 20) m.removeChild(m.firstChild);
        }, 100);
    }

    function speak(t) {
        const s = new SpeechSynthesisUtterance(t);
        s.lang = 'en-US'; s.rate = 0.9; window.speechSynthesis.speak(s);
    }

    setInterval(() => {
        const now = new Date();
        document.getElementById('timer').innerText = now.getHours() + ":" + now.getMinutes() + ":" + now.getSeconds() + ":" + now.getMilliseconds();
    }, 50);
</script>

</body>
  </html>
