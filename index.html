<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCL Store - Reyycarrierluck</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ffa3;
            --bg: #050a06;
            --surface: #0d140f;
            --border: rgba(0, 255, 163, 0.15);
            --text-dim: #8e9a91;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0; background: var(--bg); color: white;
            padding-bottom: 150px;
        }

        /* Header */
        .app-bar {
            background: rgba(4, 9, 5, 0.9);
            backdrop-filter: blur(15px);
            padding: 18px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-weight: 900; color: var(--primary); font-size: 1.4rem; letter-spacing: -1px; }

        /* Game Tabs with Images */
        .game-nav {
            display: flex; gap: 12px; padding: 20px;
            overflow-x: auto; scrollbar-width: none;
        }
        .game-nav::-webkit-scrollbar { display: none; }

        .game-card {
            min-width: 110px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 18px;
            padding: 15px; text-align: center; transition: 0.3s; cursor: pointer;
        }
        .game-card.active { background: var(--primary); color: #000; font-weight: bold; border-color: var(--primary); }
        
        .game-card img {
            width: 45px; height: 45px; object-fit: contain;
            margin-bottom: 8px; border-radius: 10px;
        }
        .game-card span { font-size: 0.7rem; display: block; text-transform: uppercase; }

        /* Section */
        .section {
            margin: 0 20px 20px; background: var(--surface);
            padding: 24px; border-radius: 20px; border: 1px solid var(--border);
        }

        h3 { margin: 0 0 15px; font-size: 0.9rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        input, select {
            width: 100%; background: rgba(0,0,0,0.4);
            border: 1.5px solid var(--border); padding: 15px;
            border-radius: 12px; color: white; font-size: 1rem;
            margin-bottom: 12px; outline: none;
        }
        input:focus { border-color: var(--primary); }

        /* Nominal Grid */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .item {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            padding: 16px; border-radius: 16px; transition: 0.2s; cursor: pointer;
            display: flex; flex-direction: column;
        }
        .item.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .item b { font-size: 0.9rem; margin-bottom: 4px; }
        .item span { font-size: 0.8rem; font-weight: bold; }

        /* Floating Checkout */
        .checkout-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #0d140f; padding: 20px;
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 2000;
        }

        .price-info div { font-size: 1.2rem; font-weight: 900; color: var(--primary); }

        .btn-buy {
            background: var(--primary); color: #000;
            border: none; padding: 14px 28px;
            border-radius: 12px; font-weight: 900; cursor: pointer;
        }

        /* Floating CS Button */
        .fab-wa {
            position: fixed; bottom: 100px; right: 20px;
            background: #25d366; width: 55px; height: 55px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 2001; text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="app-bar">
        <div class="logo">REYYCARRIERLUCK</div>
        <i class="fab fa-discord" style="color: #5865F2; font-size: 1.5rem;"></i>
    </div>

    <div class="game-nav">
        <div class="game-card active" onclick="setGame('MLBB', this)">
            <img src="https://files.catbox.moe/3p7zf1.png" alt="ML">
            <span>MLBB</span>
        </div>
        <div class="game-card" onclick="setGame('Free Fire', this)">
            <img src="https://files.catbox.moe/05tlrg.webp" alt="FF">
            <span>Free Fire</span>
        </div>
        <div class="game-card" onclick="setGame('Roblox', this)">
            <img src="https://files.catbox.moe/ehfz6o.png" alt="Roblox">
            <span>Roblox</span>
        </div>
    </div>

    <div class="section">
        <h3>1. Masukkan Data Akun</h3>
        <input type="text" id="user_id" placeholder="ID Akun / username">
        <input type="text" id="zone_id" placeholder="Zone ID (Khusus ML)">
        <input type="text" id="wa_number" placeholder="WhatsApp (628xxx)">
    </div>

    <div class="section">
        <h3>2. Pilih Nominal</h3>
        <div class="grid" id="nominal-list"></div>
    </div>

    <div class="section">
        <h3>3. Pembayaran</h3>
        <select id="payment_method">
            <option value="QRIS - Otomatis">QRIS - Otomatis</option>
            <option value="DANA / OVO / GoPay">DANA / OVO / GoPay</option>
            <option value="Transfer Bank">Transfer Bank</option>
        </select>
    </div>

    <a href="https://wa.me/6285185083991" class="fab-wa" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <div class="checkout-bar">
        <div class="price-info">
            <small id="selected-name" style="color: var(--text-dim);">Pilih Produk</small>
            <div id="display-price">Rp 0</div>
        </div>
        <button class="btn-buy" id="btnBuy" onclick="kirimOrder()">BELI SEKARANG</button>
    </div>

    <script>
        // MASUKKAN WEBHOOK BARU ANDA DI SINI
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1501815132282425385/9Bd8dzmnIYMv4rR0pP9C-22EfTyAVGN8u6Bp5ZJC25VRz6gG1KoNVAF1y1GS_GBcp5oP';

        let currentGame = 'MLBB';
        let currentItem = '';
        let currentPrice = '';

        // KATALOG LENGKAP
        const catalog = {
            'MLBB': [
                {n: '5 Diamonds', p: 'Rp 1.600'}, {n: '12 Diamonds', p: 'Rp 3.500'},
                {n: '28 Diamonds', p: 'Rp 8.100'}, {n: '59 Diamonds', p: 'Rp 16.200'},
                {n: '85 Diamonds', p: 'Rp 23.500'}, {n: '170 Diamonds', p: 'Rp 48.000'},
                {n: '296 Diamonds', p: 'Rp 82.000'}, {n: 'Weekly Diamond Pass', p: 'Rp 29.500'},
                {n: 'Twilight Pass', p: 'Rp 150.000'}, {n: '568 Diamonds', p: 'Rp 155.000'}
            ],
            'Free Fire': [
                {n: '5 Diamonds', p: 'Rp 1.000'}, {n: '12 Diamonds', p: 'Rp 2.000'},
                {n: '50 Diamonds', p: 'Rp 7.000'}, {n: '70 Diamonds', p: 'Rp 9.500'},
                {n: '140 Diamonds', p: 'Rp 19.000'}, {n: '355 Diamonds', p: 'Rp 46.000'},
                {n: '720 Diamonds', p: 'Rp 91.000'}, {n: 'Member Mingguan', p: 'Rp 29.000'},
                {n: 'Member Bulanan', p: 'Rp 145.000'}
            ],
            'Roblox': [
                {n: '80 Robux', p: 'Rp 13.000'}, {n: '160 Robux', p: 'Rp 25.000'},
                {n: '400 Robux', p: 'Rp 65.000'}, {n: '800 Robux', p: 'Rp 125.000'},
                {n: '1700 Robux', p: 'Rp 265.000'}, {n: '4500 Robux', p: 'Rp 680.000'}
            ]
        };

        window.onload = () => renderNominal();

        function setGame(game, el) {
            currentGame = game;
            document.querySelectorAll('.game-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('zone_id').style.display = (game === 'MLBB') ? 'block' : 'none';
            
            // Reset Selections
            currentItem = '';
            document.getElementById('selected-name').innerText = "Pilih Produk";
            document.getElementById('display-price').innerText = "Rp 0";
            renderNominal();
        }

        function renderNominal() {
            const container = document.getElementById('nominal-list');
            container.innerHTML = '';
            catalog[currentGame].forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<b>${item.n}</b><span>${item.p}</span>`;
                div.onclick = () => {
                    document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
                    div.classList.add('active');
                    currentItem = item.n;
                    currentPrice = item.p;
                    document.getElementById('selected-name').innerText = item.n;
                    document.getElementById('display-price').innerText = item.p;
                };
                container.appendChild(div);
            });
        }

        async function kirimOrder() {
            const uid = document.getElementById('user_id').value;
            const zid = document.getElementById('zone_id').value || '-';
            const wa = document.getElementById('wa_number').value;
            const pay = document.getElementById('payment_method').value;
            const btn = document.getElementById('btnBuy');

            if(!uid || !currentItem || !wa) {
                alert("Lengkapi Data Akun dan Pilihan Produk!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "MEMPROSES...";

            const msg = {
                username: "RCL NOTIFICATION",
                embeds: [{
                    title: " [RCL INFO] New Order!! 🍀",
                    color: 65283,
                    fields: [
                        { name: "Game", value: currentGame, inline: true },
                        { name: "Produk", value: currentItem, inline: true },
                        { name: "Harga", value: currentPrice, inline: true },
                        { name: "ID / Server", value: `ID: ${uid} | Zone: ${zid}`, inline: false },
                        { name: "WhatsApp Pembeli", value: `[Hubungi WA](https://wa.me/${wa})`, inline: true },
                        { name: "Metode", value: pay, inline: true }
                    ]
                }]
            };

            try {
                const res = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(msg)
                });
                if(res.ok) alert("Pesanan Terkirim! Admin akan segera menghubungi WhatsApp Anda.");
                else alert("Gagal mengirim! Pastikan Webhook URL benar.");
            } catch (e) { alert("Error: " + e); }
            finally {
                btn.disabled = false;
                btn.innerText = "BELI SEKARANG";
            }
        }
    </script>
</body>
</html>
