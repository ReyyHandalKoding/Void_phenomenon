<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCL Store - Reyycarrierluck</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ffa3;
            --bg: #050a06;
            --surface: #0d140f;
            --border: rgba(0, 255, 163, 0.15);
            --text-dim: #8e9a91;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0; background: var(--bg); color: white;
            padding-bottom: 150px;
        }

        /* Header */
        .app-bar {
            background: rgba(4, 9, 5, 0.9);
            backdrop-filter: blur(15px);
            padding: 18px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-weight: 900; color: var(--primary); font-size: 1.4rem; letter-spacing: -1px; }

        /* Game Tabs */
        .game-nav {
            display: flex; gap: 12px; padding: 20px;
            overflow-x: auto; scrollbar-width: none;
        }
        .game-nav::-webkit-scrollbar { display: none; }

        .game-card {
            min-width: 100px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 18px;
            padding: 12px; text-align: center; transition: 0.3s;
        }
        .game-card.active { background: var(--primary); color: #000; font-weight: bold; }
        .game-card i { font-size: 1.4rem; margin-bottom: 5px; display: block; }
        .game-card span { font-size: 0.7rem; }

        /* Section */
        .section {
            margin: 0 20px 20px; background: var(--surface);
            padding: 24px; border-radius: 20px; border: 1px solid var(--border);
        }

        h3 { margin: 0 0 15px; font-size: 0.9rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        input {
            width: 100%; background: rgba(0,0,0,0.4);
            border: 1.5px solid var(--border); padding: 15px;
            border-radius: 12px; color: white; font-size: 1rem;
            margin-bottom: 12px; outline: none;
        }
        input:focus { border-color: var(--primary); }

        /* Nominal Grid */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .item {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            padding: 16px; border-radius: 16px; transition: 0.2s;
        }
        .item.active { background: var(--primary); color: #000; border-color: var(--primary); font-weight: 800; }
        .item b { display: block; font-size: 0.9rem; }
        .item span { font-size: 0.75rem; opacity: 0.8; }

        /* Floating Checkout */
        .checkout-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #0d140f; padding: 20px;
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 2000; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .price-info small { color: var(--text-dim); font-size: 0.7rem; display: block; }
        .price-info div { font-size: 1.2rem; font-weight: 900; color: var(--primary); }

        .btn-buy {
            background: var(--primary); color: #000;
            border: none; padding: 14px 28px;
            border-radius: 12px; font-weight: 900;
            font-size: 0.9rem; transition: 0.3s;
        }
        .btn-buy:active { transform: scale(0.95); }
        .btn-buy:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
